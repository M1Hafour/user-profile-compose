# Kubernetes configuration: Nginx forwards API requests to the backend Service.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;

    gzip on;
    gzip_min_length 256;
    gzip_types text/css text/javascript application/javascript application/json text/plain;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 60s;

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://user-profile-backend:3000;
    }
    location = /health {
        proxy_pass http://user-profile-backend:3000;
    }
    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }
}
