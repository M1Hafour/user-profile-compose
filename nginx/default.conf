# Public entry point (plain HTTP). Serves the web page and forwards /api and /health to the app.
# To turn on HTTPS by hand, see GUIDE.md (part 8) and nginx/https.conf.example.

# At most 20 API requests per second per client IP (short bursts are allowed).
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;

    # Docker's own DNS server. The name "app" is looked up when a request comes in,
    # not when nginx starts, so nginx starts even if the app container is not up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://app:3000;

    gzip on;
    gzip_min_length 256;
    gzip_types text/css text/javascript application/javascript application/json text/plain;

    # Security headers. They are not repeated inside the locations below, because
    # nginx would drop the server-level headers in a location that sets its own.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 60s;

    # --- Backend API ---
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass $backend;
    }

    location = /health {
        proxy_pass $backend;
    }

    # --- Web page (static files) ---
    location / {
        try_files $uri $uri/ =404;
        expires -1;   # always revalidate, so a new version of the page shows up at once
    }
}
