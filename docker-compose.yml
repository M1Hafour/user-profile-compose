# One server, three containers. Only nginx is reachable from the internet.
#
#   cp .env.example .env      (then fill it in)
#   docker compose up -d --build
#
# See GUIDE.md for the full steps.

name: user-profile-compose

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"          # used only after you set up HTTPS by hand (GUIDE.md, part 8)
    volumes:
      - ./frontend/public:/usr/share/nginx/html:ro          # the web page
      # HTTP config by default. On the server, NGINX_CONF in .env points to the HTTPS file (GUIDE.md, part 8).
      - ${NGINX_CONF:-./nginx/default.conf}:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro                         # HTTPS files, only if you use them
    depends_on:
      - app

  app:
    build: ./backend
    restart: unless-stopped
    expose:
      - "3000"             # reachable from nginx only, not from the internet
    environment:
      PORT: "3000"
      MONGO_HOSTNAME: mongodb
      MONGO_PORT: "27017"
      MONGO_DB: ${MONGO_DB:-user-profile}
      MONGO_USERNAME: ${MONGO_USERNAME:?set MONGO_USERNAME in .env}
      MONGO_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}
    depends_on:
      - mongodb
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then((r) => r.json()).then((j) => process.exit(j.mongo === 'connected' ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  mongodb:
    image: mongo:7
    restart: unless-stopped
    environment:
      # Used only when the data volume is created for the first time (see GUIDE.md, troubleshooting).
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:?set MONGO_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}
    volumes:
      - mongo-data:/data/db
    # No "ports:" on purpose: the database is reachable only by the other containers.

volumes:
  mongo-data:
