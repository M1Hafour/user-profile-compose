apiVersion: v1
kind: Service
metadata:
  name: user-profile-backend
  namespace: user-profile
spec:
  selector:
    app: user-profile-backend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-profile-backend
  namespace: user-profile
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-profile-backend
  template:
    metadata:
      labels:
        app: user-profile-backend
    spec:
      nodeSelector:
        workload: user-profile
      containers:
        - name: backend
          image: __DOCKERHUB_USER__/user-profile-api:__IMAGE_TAG__
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: MONGO_HOSTNAME
              value: mongodb
            - name: MONGO_PORT
              value: "27017"
            - name: MONGO_DB
              value: user-profile
            - name: MONGO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: user-profile-secrets
                  key: MONGO_USERNAME
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: user-profile-secrets
                  key: MONGO_PASSWORD
            - name: NODE_OPTIONS
              value: --max-old-space-size=160
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
