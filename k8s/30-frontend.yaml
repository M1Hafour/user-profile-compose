apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-profile-frontend
  namespace: user-profile
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-profile-frontend
  template:
    metadata:
      labels:
        app: user-profile-frontend
    spec:
      nodeSelector:
        workload: user-profile
      containers:
        - name: nginx
          image: __DOCKERHUB_USER__/user-profile-frontend:__IMAGE_TAG__
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 80Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: user-profile-frontend
  namespace: user-profile
spec:
  selector:
    app: user-profile-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
