apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: user-profile
  namespace: user-profile
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: user-profile-frontend
                port:
                  number: 80
