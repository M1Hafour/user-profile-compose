apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: user-profile
  namespace: user-profile
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - myuserapp.duckdns.org
      secretName: user-profile-tls
  rules:
    - host: myuserapp.duckdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: user-profile-frontend
                port:
                  number: 80
